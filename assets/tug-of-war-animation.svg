<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes heaveLeft {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-10px, 3px) rotate(-3deg); }
    }
    @keyframes heaveRight {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(10px, 3px) rotate(3deg); }
    }
    @keyframes ropeSway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-8px); }
    }
    @keyframes floatMath {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    .team-left { animation: heaveLeft 1.4s ease-in-out infinite; transform-origin: 220px 210px; }
    .team-right { animation: heaveRight 1.4s ease-in-out infinite; transform-origin: 680px 210px; }
    .rope-group { animation: ropeSway 1.4s ease-in-out infinite; }
    .math-symbol { animation: floatMath 2.2s ease-in-out infinite; font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; }
    .center-glow { animation: pulseGlow 2s ease-in-out infinite; }
  </style>

  <!-- Stadium Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="896" height="276" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Center Dividing Axis -->
  <line x1="450" y1="20" x2="450" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <ellipse cx="450" cy="215" rx="70" ry="14" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.25" />

  <!-- Ground Platform -->
  <line x1="60" y1="215" x2="840" y2="215" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Math Badges in Sky -->
  <g class="math-symbol" style="animation-delay: 0s;">
    <rect x="90" y="30" width="46" height="32" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="113" y="52" fill="#93c5fd" font-size="18" text-anchor="middle">24 ÷ 6</text>
  </g>
  <g class="math-symbol" style="animation-delay: 0.4s;">
    <rect x="220" y="22" width="42" height="32" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="241" y="44" fill="#60a5fa" font-size="18" text-anchor="middle">9²</text>
  </g>
  <g class="math-symbol" style="animation-delay: 0.8s;">
    <rect x="630" y="22" width="44" height="32" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="652" y="44" fill="#fda4af" font-size="18" text-anchor="middle">√49</text>
  </g>
  <g class="math-symbol" style="animation-delay: 1.2s;">
    <rect x="760" y="30" width="48" height="32" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="784" y="52" fill="#f43f5e" font-size="18" text-anchor="middle">5³ = ?</text>
  </g>

  <!-- Animated Tug of War Characters -->

  <!-- TEAM BLUE (LEFT) -->
  <g class="team-left">
    <!-- Boy 1 Back -->
    <g transform="translate(140, 95)">
      <!-- Body leaning back -->
      <line x1="30" y1="120" x2="45" y2="80" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <line x1="50" y1="120" x2="52" y2="80" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <rect x="30" y="38" width="34" height="46" rx="10" fill="url(#blueGrad)" />
      <!-- Head -->
      <circle cx="48" cy="20" r="18" fill="#fed7aa" />
      <!-- Cap -->
      <path d="M 28 16 Q 48 4 68 16 L 76 18 L 68 22 Z" fill="#1d4ed8" />
      <!-- Face -->
      <circle cx="56" cy="18" r="2.5" fill="#0f172a" />
      <path d="M 52 26 Q 58 24 62 27" stroke="#0f172a" stroke-width="2" fill="none" />
      <!-- Arms pulling rope -->
      <path d="M 46 50 L 75 75 L 115 72" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" fill="none" />
    </g>

    <!-- Boy 2 Front (Anchor) -->
    <g transform="translate(225, 95)">
      <!-- Legs digging into ground -->
      <line x1="20" y1="120" x2="45" y2="80" stroke="#1e293b" stroke-width="11" stroke-linecap="round" />
      <line x1="50" y1="120" x2="55" y2="80" stroke="#1e293b" stroke-width="11" stroke-linecap="round" />
      <!-- Shoes -->
      <ellipse cx="16" cy="120" rx="12" ry="5" fill="#0284c7" />
      <ellipse cx="50" cy="120" rx="12" ry="5" fill="#0284c7" />
      <rect x="30" y="38" width="36" height="46" rx="10" fill="url(#blueGrad)" />
      <rect x="30" y="52" width="36" height="8" fill="#93c5fd" />
      <!-- Head -->
      <circle cx="48" cy="20" r="18" fill="#fed7aa" />
      <!-- Hair -->
      <path d="M 28 18 Q 38 4 58 6 Q 66 10 68 20 Q 56 12 36 22 Z" fill="#451a03" />
      <!-- Determined Gritted Face -->
      <circle cx="56" cy="18" r="2.5" fill="#0f172a" />
      <rect x="52" y="24" width="12" height="5" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <!-- Arms gripping rope -->
      <path d="M 44 48 L 72 74 L 115 72" stroke="#fed7aa" stroke-width="9" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- ROPE AND CENTER RIBBON -->
  <g class="rope-group">
    <!-- Rope -->
    <path d="M 260 168 Q 355 174 450 168 Q 545 174 640 168" stroke="url(#ropeGrad)" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 260 168 Q 355 174 450 168 Q 545 174 640 168" stroke="#78350f" stroke-width="1.5" stroke-dasharray="4,6" fill="none" opacity="0.6" />

    <!-- Center Red Victory Ribbon Marker -->
    <g transform="translate(450, 168)">
      <circle cx="0" cy="0" r="12" fill="#ef4444" filter="url(#glow)" />
      <circle cx="0" cy="0" r="7" fill="#fbbf24" />
      <!-- Ribbon Tails -->
      <polygon points="-5,8 0,32 5,8" fill="#ef4444" />
      <polygon points="-7,6 -10,24 -3,8" fill="#dc2626" />
      <polygon points="7,6 10,24 3,8" fill="#dc2626" />
    </g>
  </g>

  <!-- TEAM RED (RIGHT) -->
  <g class="team-right">
    <!-- Boy 2 Front (Anchor) -->
    <g transform="translate(605, 95)">
      <!-- Legs digging into ground -->
      <line x1="50" y1="120" x2="25" y2="80" stroke="#1e293b" stroke-width="11" stroke-linecap="round" />
      <line x1="20" y1="120" x2="15" y2="80" stroke="#1e293b" stroke-width="11" stroke-linecap="round" />
      <!-- Shoes -->
      <ellipse cx="54" cy="120" rx="12" ry="5" fill="#e11d48" />
      <ellipse cx="20" cy="120" rx="12" ry="5" fill="#e11d48" />
      <rect x="6" y="38" width="36" height="46" rx="10" fill="url(#redGrad)" />
      <rect x="6" y="52" width="36" height="8" fill="#fda4af" />
      <!-- Head -->
      <circle cx="22" cy="20" r="18" fill="#fde68a" />
      <!-- Hair/Cap -->
      <path d="M 42 16 Q 22 4 2 16 L -6 18 L 2 22 Z" fill="#be123c" />
      <!-- Determined Face -->
      <circle cx="14" cy="18" r="2.5" fill="#0f172a" />
      <rect x="8" y="24" width="12" height="5" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
      <!-- Arms gripping rope -->
      <path d="M 28 48 L 0 74 L -45 72" stroke="#fde68a" stroke-width="9" stroke-linecap="round" fill="none" />
    </g>

    <!-- Boy 1 Back -->
    <g transform="translate(690, 95)">
      <line x1="40" y1="120" x2="25" y2="80" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <line x1="18" y1="120" x2="16" y2="80" stroke="#1e293b" stroke-width="10" stroke-linecap="round" />
      <rect x="6" y="38" width="34" height="46" rx="10" fill="url(#redGrad)" />
      <!-- Head -->
      <circle cx="22" cy="20" r="18" fill="#fde68a" />
      <!-- Hair -->
      <path d="M 42 18 Q 32 4 12 6 Q 4 10 2 20 Q 14 12 34 22 Z" fill="#78350f" />
      <!-- Face -->
      <circle cx="14" cy="18" r="2.5" fill="#0f172a" />
      <path d="M 18 26 Q 12 24 8 27" stroke="#0f172a" stroke-width="2" fill="none" />
      <!-- Arms -->
      <path d="M 24 50 L -5 75 L -45 72" stroke="#fde68a" stroke-width="8" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Title Badge in Center -->
  <g transform="translate(450, 48)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="6" fill="#fde047" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">🪢 TUG OF MATH BATTLE</text>
  </g>
</svg>